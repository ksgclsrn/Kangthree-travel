<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강쓰리 가족 여행 기록</title>
<style>
  :root{
    --void:#04060e;
    --ink:#080c1c;
    --violet:#5b4a9c;
    --rose:#c07a9e;
    --gold:#e9c78f;
    --sand:#f0dcc0;
    --mist:#ccd3ea;
    --dim:#8992b2;
    --line:rgba(204,211,234,.15);
    --panel:rgba(10,15,36,.62);
    --font-display:'HyundaiHarmony','현대하모니','Hyundai Harmony','Nanum Myeongjo','Apple SD Gothic Neo','Malgun Gothic',serif;
    --font-body:'HyundaiHarmony','현대하모니','Hyundai Harmony','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --font-num:Georgia,'Times New Roman',serif;
    --w:1100px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--void);color:var(--mist);font-family:var(--font-body);
    line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:3px}

  /* ---------- 배경 ---------- */
  #sky{position:fixed;inset:0;z-index:0;display:block}
  .bgv{position:fixed;inset:0;z-index:0;overflow:hidden;opacity:0;transition:opacity 1.6s ease}
  .bgv.on{opacity:.55}
  .bgv iframe{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:100vw;height:56.25vw;min-height:100vh;min-width:177.78vh;border:0;pointer-events:none}
  .neb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .neb i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.45;mix-blend-mode:screen}
  .neb .a{width:70vw;height:70vw;left:-20vw;top:-18vw;
    background:radial-gradient(circle,rgba(91,74,156,.9),transparent 68%);
    animation:d1 52s ease-in-out infinite alternate}
  .neb .b{width:58vw;height:58vw;right:-16vw;top:26vh;
    background:radial-gradient(circle,rgba(192,122,158,.62),transparent 68%);
    animation:d2 68s ease-in-out infinite alternate}
  @keyframes d1{to{transform:translate3d(10vw,8vh,0) scale(1.18)}}
  @keyframes d2{to{transform:translate3d(-12vw,-7vh,0) scale(1.12)}}
  .veil{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% -10%,transparent 34%,rgba(4,6,14,.86) 100%)}
  .page{position:relative;z-index:1}

  .bg-toggle{position:fixed;right:18px;bottom:18px;z-index:50;
    border:1px solid var(--line);background:rgba(4,6,14,.7);backdrop-filter:blur(10px);
    color:var(--dim);border-radius:999px;padding:9px 16px;font-size:12.5px;cursor:pointer}
  .bg-toggle:hover{color:var(--gold);border-color:var(--gold)}

  /* ---------- 히어로 ---------- */
  .hero{min-height:100svh;display:grid;place-items:center;text-align:center;padding:90px 24px 64px}
  .hero-in{max-width:820px;position:relative}
  .eyebrow{font-size:11.5px;letter-spacing:.44em;text-transform:uppercase;color:var(--gold);
    opacity:.9;margin:0 0 24px}
  .hero h1{font-family:var(--font-display);font-weight:400;margin:0;
    font-size:clamp(42px,9.5vw,88px);letter-spacing:.06em;line-height:1.14;
    text-shadow:0 0 46px rgba(192,122,158,.32)}
  .hero .greet{margin:24px auto 0;max-width:32em;color:var(--dim);
    font-size:clamp(14px,2.3vw,17px);white-space:pre-wrap}
  .stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:44px 0 30px}
  .stat{min-width:104px;padding:16px 20px;border:1px solid var(--line);border-radius:12px;
    background:rgba(8,12,28,.4);backdrop-filter:blur(6px)}
  .stat b{display:block;font-family:var(--font-num);font-size:30px;font-weight:400;color:var(--sand);line-height:1.1}
  .stat span{font-size:11px;letter-spacing:.2em;color:var(--dim)}
  .scroll-cue{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
    font-size:10.5px;letter-spacing:.34em;color:var(--dim)}
  .scroll-cue i{display:block;width:1px;height:40px;margin:10px auto 0;
    background:linear-gradient(var(--gold),transparent)}

  /* ---------- 내비 ---------- */
  .nav{position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);
    background:rgba(4,6,14,.72);border-bottom:1px solid var(--line)}
  .nav-in{max-width:var(--w);margin:0 auto;padding:0 24px;display:flex;gap:4px;
    align-items:center;justify-content:center;flex-wrap:wrap;min-height:56px}
  .nav a{text-decoration:none;padding:9px 15px;border-radius:999px;font-size:14px;color:var(--dim)}
  .nav a:hover{color:var(--gold);background:rgba(233,199,143,.09)}

  /* ---------- 섹션 ---------- */
  .sec{max-width:var(--w);margin:0 auto;padding:92px 24px}
  .sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;
    flex-wrap:wrap;margin-bottom:30px;border-bottom:1px solid var(--line);padding-bottom:16px}
  .sec-head h2{font-family:var(--font-display);font-weight:400;margin:0;
    font-size:clamp(25px,4.2vw,36px);letter-spacing:.05em}
  .sec-head p{margin:7px 0 0;color:var(--dim);font-size:13.5px}

  .btn{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--mist);
    padding:10px 18px;border-radius:999px;font-size:13.5px;cursor:pointer;
    transition:border-color .2s,color .2s,background .2s}
  .btn:hover{border-color:var(--gold);color:var(--gold);background:rgba(233,199,143,.08)}
  .btn-gold{border-color:rgba(233,199,143,.5);color:var(--gold)}
  .btn-sm{padding:6px 13px;font-size:12.5px}
  .btn-q{border-color:transparent;color:var(--dim)}
  .btn-q:hover{color:var(--rose);background:rgba(192,122,158,.1)}

  .empty{border:1px dashed var(--line);border-radius:14px;padding:54px 24px;text-align:center;
    color:var(--dim);font-size:14.5px}
  .empty strong{display:block;color:var(--mist);font-family:var(--font-display);font-weight:400;
    font-size:18px;margin-bottom:8px;letter-spacing:.04em}

  .filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:26px}
  .fchip{border:1px solid var(--line);background:none;color:var(--dim);border-radius:999px;
    padding:6px 15px;font-size:12.5px;cursor:pointer;font-family:var(--font-num);letter-spacing:.06em}
  .fchip:hover{color:var(--gold)}
  .fchip.on{border-color:var(--gold);color:var(--gold);background:rgba(233,199,143,.1)}

  /* ---------- 타임라인 ---------- */
  .yr{position:relative;padding-left:52px;margin-bottom:14px}
  .yr::before{content:'';position:absolute;left:15px;top:0;bottom:-14px;width:1px;
    background:linear-gradient(rgba(233,199,143,.42),rgba(233,199,143,.06))}
  .yr:last-child::before{bottom:40px}
  .yr-label{position:relative;font-family:var(--font-num);font-size:26px;letter-spacing:.1em;
    color:var(--sand);margin-bottom:20px}
  .yr-label::before{content:'';position:absolute;left:-44px;top:16px;width:9px;height:9px;
    border-radius:50%;background:var(--gold);box-shadow:0 0 0 5px rgba(233,199,143,.16)}
  .yr-label small{font-family:var(--font-body);font-size:12px;letter-spacing:.16em;
    color:var(--dim);margin-left:12px}

  .tcard{display:grid;grid-template-columns:210px 1fr;gap:20px;margin-bottom:20px;
    border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);
    cursor:pointer;transition:border-color .25s,transform .25s}
  .tcard:hover{border-color:rgba(233,199,143,.44);transform:translateY(-2px)}
  .tcard .cov{background:rgba(255,255,255,.03);min-height:158px;position:relative;overflow:hidden}
  .tcard .cov img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
  .tcard .cov.none{display:grid;place-items:center;color:var(--dim);font-size:11px;letter-spacing:.22em}
  .tcard .bd{padding:20px 22px 20px 0;display:flex;flex-direction:column;gap:7px}
  .tcard .loc{font-size:11.5px;letter-spacing:.2em;color:var(--gold)}
  .tcard h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:23px;letter-spacing:.03em}
  .tcard .per{font-family:var(--font-num);font-size:13px;color:var(--dim);letter-spacing:.05em}
  .tcard .sum{font-size:13.5px;color:var(--dim)}
  .tcard .foot{margin-top:auto;padding-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .stars{color:var(--gold);font-size:13px;letter-spacing:.14em}
  .pill{font-size:11px;letter-spacing:.1em;padding:3px 10px;border-radius:999px;
    border:1px solid var(--line);color:var(--dim)}
  .pill.ph{color:var(--rose);border-color:rgba(192,122,158,.32)}

  /* ---------- 상세 ---------- */
  .detail{position:fixed;inset:0;z-index:70;background:rgba(4,6,14,.96);backdrop-filter:blur(10px);
    overflow-y:auto;display:none}
  .detail.on{display:block}
  .dt-in{max-width:880px;margin:0 auto;padding:26px 24px 100px}
  .dt-bar{display:flex;justify-content:space-between;gap:12px;align-items:center;
    position:sticky;top:0;padding:14px 0;background:linear-gradient(rgba(4,6,14,.98),rgba(4,6,14,.86));z-index:2}
  .dt-hero{margin:18px 0 30px}
  .dt-cover{width:100%;aspect-ratio:21/9;object-fit:cover;border-radius:16px;
    border:1px solid var(--line);display:block;margin-bottom:24px}
  .dt-hero .loc{font-size:11.5px;letter-spacing:.22em;color:var(--gold);margin-bottom:8px}
  .dt-hero h2{font-family:var(--font-display);font-weight:400;margin:0 0 8px;
    font-size:clamp(28px,5.4vw,42px);letter-spacing:.04em}
  .dt-hero .per{font-family:var(--font-num);font-size:14.5px;color:var(--dim);letter-spacing:.05em}
  .dt-hero .sum{margin-top:14px;font-size:15px;color:var(--mist);max-width:44em}
  .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:26px 0 8px}
  .meta div{background:var(--ink);padding:14px 16px}
  .meta dt{font-size:11px;letter-spacing:.18em;color:var(--dim);margin-bottom:5px}
  .meta dd{margin:0;font-size:14px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 6px}

  .dayblk{border-left:1px solid var(--line);padding:4px 0 26px 24px;margin-left:9px;position:relative}
  .dayblk::before{content:'';position:absolute;left:-5px;top:9px;width:9px;height:9px;border-radius:50%;
    background:var(--rose);box-shadow:0 0 0 4px rgba(192,122,158,.16)}
  .dayblk .dh{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  .dayblk .dnum{font-family:var(--font-num);font-size:12.5px;letter-spacing:.22em;color:var(--gold)}
  .dayblk h4{margin:0;font-family:var(--font-display);font-weight:400;font-size:20px;letter-spacing:.03em}
  .dayblk .dd{font-family:var(--font-num);font-size:12.5px;color:var(--dim)}
  .dayblk .places{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
  .dayblk .places li{font-size:14px;padding-left:16px;position:relative}
  .dayblk .places li::before{content:'';position:absolute;left:0;top:11px;width:5px;height:1px;background:var(--gold)}
  .dayblk .places li em{font-style:normal;color:var(--dim);font-size:13px}
  .dayblk .dmemo{margin-top:12px;font-size:14px;color:var(--dim);white-space:pre-wrap}
  .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin-top:14px}
  .shots img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;
    border:1px solid var(--line);cursor:pointer;display:block}
  .dayacts{margin-top:14px;display:flex;gap:5px;flex-wrap:wrap}

  /* ---------- 사진첩 ---------- */
  .album{columns:4;column-gap:12px}
  .plate{break-inside:avoid;margin-bottom:12px;position:relative;border-radius:10px;
    overflow:hidden;border:1px solid var(--line);cursor:pointer}
  .plate img{width:100%;display:block}
  .plate figcaption{position:absolute;inset:auto 0 0 0;padding:22px 12px 10px;font-size:11.5px;
    background:linear-gradient(transparent,rgba(4,6,14,.9));opacity:0;transition:opacity .2s}
  .plate:hover figcaption{opacity:1}

  /* ---------- 기념일 ---------- */
  .day-row{display:grid;grid-template-columns:92px 1fr auto;gap:16px;align-items:center;
    padding:17px 4px;border-bottom:1px solid var(--line)}
  .dday{font-family:var(--font-num);font-size:22px;color:var(--gold);text-align:right}
  .dday.past{color:var(--dim)}
  .dday small{display:block;font-family:var(--font-body);font-size:10.5px;letter-spacing:.2em;color:var(--dim)}
  .day-body .t{font-size:16px}
  .day-body .d{font-family:var(--font-num);font-size:12.5px;color:var(--dim)}

  /* ---------- 시간표 ---------- */
  .members{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;
    border:1px solid var(--line);font-size:13px}
  .chip i{width:8px;height:8px;border-radius:50%}
  .chip button{border:none;background:none;color:var(--dim);cursor:pointer;font-size:14px}
  .chip button:hover{color:var(--rose)}
  .tt-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
  table.tt{border-collapse:collapse;width:100%;min-width:640px}
  table.tt th,table.tt td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;vertical-align:top}
  table.tt th:last-child,table.tt td:last-child{border-right:none}
  table.tt tr:last-child td{border-bottom:none}
  table.tt thead th{padding:12px 8px;font-weight:400;font-size:12.5px;letter-spacing:.12em;color:var(--dim)}
  table.tt thead th.sun{color:var(--rose)}
  table.tt tbody th{width:78px;padding:13px 10px;font-weight:400;font-size:12.5px;color:var(--gold);text-align:left}
  .cell{width:100%;min-height:58px;background:none;border:none;cursor:pointer;padding:10px;
    text-align:left;color:var(--mist);font-size:13px;line-height:1.5}
  .cell:hover{background:rgba(233,199,143,.07)}
  .cell .who{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--dim);margin-top:4px}
  .cell .who i{width:6px;height:6px;border-radius:50%}
  .cell.blank{color:rgba(137,146,178,.4);font-size:17px}

  /* ---------- 모달 / 라이트박스 ---------- */
  .scrim{position:fixed;inset:0;z-index:90;background:rgba(2,3,10,.82);backdrop-filter:blur(6px);
    display:none;place-items:center;padding:20px}
  .scrim.on{display:grid}
  .modal{width:min(520px,100%);max-height:88svh;overflow:auto;border-radius:18px;
    border:1px solid var(--line);background:#070b1c;padding:26px}
  .modal h3{margin:0 0 18px;font-family:var(--font-display);font-weight:400;font-size:21px;letter-spacing:.05em}
  .fld{margin-bottom:14px}
  .fld.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .fld label{display:block;font-size:11.5px;letter-spacing:.16em;color:var(--dim);margin-bottom:6px}
  .fld input,.fld textarea,.fld select{width:100%;padding:10px 12px;border-radius:9px;
    font-family:inherit;font-size:14px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:var(--mist)}
  .fld textarea{min-height:74px;resize:vertical}
  .fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--gold);outline:none}
  .fld select option{background:#070b1c}
  .hint{font-size:11.5px;color:var(--dim);margin-top:6px}
  .modal-acts{display:flex;gap:9px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
  .lightbox{position:fixed;inset:0;z-index:95;background:rgba(2,3,10,.95);display:none;
    place-items:center;padding:24px}
  .lightbox.on{display:grid}
  .lightbox img{max-width:94vw;max-height:82svh;border-radius:12px}
  .lightbox .cap{position:absolute;bottom:26px;left:0;right:0;text-align:center;
    color:var(--dim);font-size:13px;padding:0 24px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:99;
    background:#0b1030;border:1px solid var(--line);color:var(--mist);padding:12px 20px;
    border-radius:999px;font-size:13.5px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  footer{max-width:var(--w);margin:0 auto;padding:56px 24px 90px;text-align:center;
    border-top:1px solid var(--line);color:var(--dim);font-size:12.5px}
  footer .sig{font-family:var(--font-display);font-size:16px;color:var(--mist);letter-spacing:.14em;margin-bottom:9px}

  @media (max-width:900px){ .album{columns:3} }
  @media (max-width:680px){
    .album{columns:2}
    .sec{padding:70px 20px}
    .tcard{grid-template-columns:1fr}
    .tcard .cov{min-height:180px;aspect-ratio:16/9}
    .tcard .bd{padding:18px 20px}
    .yr{padding-left:34px}
    .yr::before{left:8px}
    .yr-label::before{left:-30px}
    .day-row{grid-template-columns:74px 1fr;row-gap:8px}
    .day-row .row-acts{grid-column:2;justify-content:flex-end;display:flex}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .neb i{animation:none}
    *{transition:none !important}
  }

  /* ---------- 잠금 화면 ---------- */
  #gate{position:fixed;inset:0;z-index:200;background:var(--void);
    display:grid;place-items:center;padding:24px;text-align:center}
  #gate.hide{display:none}
  .gate-in{max-width:340px;width:100%;position:relative;z-index:1}
  .gate-in .eyebrow{font-size:11px;letter-spacing:.4em;text-transform:uppercase;
    color:var(--gold);opacity:.85;margin:0 0 18px}
  .gate-in h1{font-family:var(--font-display);font-weight:400;margin:0 0 26px;
    font-size:clamp(30px,7vw,42px);letter-spacing:.06em;color:var(--mist)}
  .gate-in input{width:100%;padding:14px 16px;border-radius:10px;font-size:18px;
    letter-spacing:.3em;text-align:center;border:1px solid var(--line);
    background:rgba(255,255,255,.05);color:var(--mist);font-family:var(--font-num)}
  .gate-in input:focus{border-color:var(--gold);outline:none}
  .gate-in button{margin-top:14px;width:100%;padding:13px;border-radius:10px;
    border:1px solid rgba(233,199,143,.5);background:rgba(233,199,143,.1);
    color:var(--gold);font-size:14.5px;cursor:pointer;letter-spacing:.05em}
  .gate-in button:hover{background:rgba(233,199,143,.18)}
  .gate-err{min-height:20px;margin-top:12px;font-size:13px;color:var(--rose)}
  .page,.bg-toggle{display:none}
  .unlocked .page{display:block}
  .unlocked .bg-toggle{display:block}
</style>

<div id="gate">
  <div class="gate-in">
    <p class="eyebrow">Family only</p>
    <h1>강쓰리 가족</h1>
    <form id="gateForm" autocomplete="off">
      <input type="password" id="gatePw" inputmode="numeric" placeholder="가족 비밀번호" aria-label="가족 비밀번호">
      <div class="gate-err" id="gateErr"></div>
      <button type="submit">들어가기</button>
    </form>
  </div>
</div>

<canvas id="sky"></canvas>
<div class="bgv" id="bgv" aria-hidden="true"></div>
<div class="neb" aria-hidden="true"><i class="a"></i><i class="b"></i></div>
<div class="veil" aria-hidden="true"></div>
<button class="bg-toggle" id="bgToggle">배경 영상 켜기</button>

<div class="page">
  <header class="hero">
    <div class="hero-in">
      <p class="eyebrow">Travel archive</p>
      <h1 id="famName">강쓰리 가족</h1>
      <p class="greet" id="famGreet">다녀온 길을 기간별로 남기고, 사진을 넘기며 그날을 다시 꺼내봅니다.</p>
      <div class="stats" id="stats"></div>
      <button class="btn btn-sm" id="editHero">인사말 수정</button>
    </div>
    <div class="scroll-cue">SCROLL<i></i></div>
  </header>

  <nav class="nav"><div class="nav-in">
    <a href="#trips">여행 기록</a>
    <a href="#album">사진첩</a>
    <a href="#days">기념일 · 일정</a>
    <a href="#tt">가족 시간표</a>
  </div></nav>

  <section class="sec" id="trips">
    <div class="sec-head">
      <div><h2>여행 기록</h2><p>연도별로 쌓이고, 카드를 누르면 하루 단위 기록이 열립니다.</p></div>
      <button class="btn btn-gold" id="addTrip">여행 추가</button>
    </div>
    <div class="filters" id="filters"></div>
    <div id="tripsBox"></div>
  </section>

  <section class="sec" id="album">
    <div class="sec-head">
      <div><h2>사진첩</h2><p>모든 여행의 사진이 최근 순으로 모입니다.</p></div>
    </div>
    <div id="albumBox"></div>
  </section>

  <section class="sec" id="days">
    <div class="sec-head">
      <div><h2>기념일 · 일정</h2><p>다가오는 날짜부터 보여드립니다.</p></div>
      <button class="btn btn-gold" id="addDay">날짜 추가</button>
    </div>
    <div id="daysBox"></div>
  </section>

  <section class="sec" id="tt">
    <div class="sec-head">
      <div><h2>가족 시간표</h2><p>칸을 누르면 바로 고칠 수 있습니다.</p></div>
      <button class="btn btn-gold" id="addMember">가족 추가</button>
    </div>
    <div class="members" id="memberBox"></div>
    <div class="tt-wrap"><table class="tt" id="ttTable"></table></div>
  </section>

  <footer>
    <div class="sig">강쓰리 가족</div>
    <div>이 페이지의 기록은 이 브라우저에만 저장됩니다.</div>
    <div style="margin-top:14px"><button class="btn btn-sm btn-q" id="resetAll">전체 내용 지우기</button></div>
  </footer>
</div>

<div class="detail" id="detail"><div class="dt-in" id="detailIn"></div></div>
<div class="scrim" id="scrim"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="lightbox" id="lightbox"><img id="lbImg" alt=""><div class="cap" id="lbCap"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ========== 저장소 ========== */
const S={
  async get(k,fb){try{const r=await window.storage.get(k);return r?JSON.parse(r.value):fb}catch(e){return fb}},
  async set(k,v){try{await window.storage.set(k,JSON.stringify(v));return true}
    catch(e){toast('저장하지 못했습니다. 사진 수를 줄여보세요.');return false}},
  async del(k){try{await window.storage.delete(k)}catch(e){}}
};
const K={hero:'kt:hero',trips:'kt:trips',days:'kt:days',tt:'kt:tt',bg:'kt:bgvideo'};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS=['월','화','수','목','금','토','일'];
const PALETTE=['#e9c78f','#c07a9e','#7ea6d8','#8fd6c0','#b39ddb','#e0a97e'];

let hero={name:'강쓰리 가족',greet:'다녀온 길을 기간별로 남기고, 사진을 넘기며 그날을 다시 꺼내봅니다.'};
let trips=[]; let days=[]; let tt=null; let filterYear='all'; let openTripId=null;

/* ========== 유틸 ========== */
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3200)}
const today=()=>new Date().toISOString().slice(0,10);
function fmt(d){if(!d)return'';const[y,m,dd]=d.split('-');return `${y}. ${m}. ${dd}`}
function nights(a,b){if(!a||!b)return null;
  const n=Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
  return n<0?null:(n===0?'당일':`${n}박 ${n+1}일`)}
function periodText(t){
  if(!t.from)return'';
  const n=nights(t.from,t.to||t.from);
  return fmt(t.from)+(t.to&&t.to!==t.from?' — '+fmt(t.to):'')+(n?`  ·  ${n}`:'');
}
function stars(n){n=+n||0;return '★'.repeat(n)+'☆'.repeat(5-n)}
function ddayInfo(d,yearly){
  if(!d)return{label:'',past:true,sort:Infinity};
  const t=new Date();t.setHours(0,0,0,0);
  let g=new Date(d+'T00:00:00');
  if(yearly){g.setFullYear(t.getFullYear());if(g<t)g.setFullYear(t.getFullYear()+1)}
  const diff=Math.round((g-t)/86400000);
  if(diff===0)return{label:'D-DAY',past:false,sort:0};
  if(diff>0)return{label:'D-'+diff,past:false,sort:diff};
  return{label:'D+'+Math.abs(diff),past:true,sort:1e9-diff};
}
function shrink(file,maxDim,q){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const img=new Image();
      img.onload=()=>{let{width:w,height:h}=img;
        const s=Math.min(1,maxDim/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',q))};
      img.onerror=()=>rej(new Error('이미지를 읽지 못했습니다.'));img.src=fr.result};
    fr.onerror=()=>rej(new Error('파일을 읽지 못했습니다.'));fr.readAsDataURL(file)});
}
async function pickPhotos(multiple){
  return new Promise(res=>{
    const inp=document.createElement('input');
    inp.type='file';inp.accept='image/*';if(multiple)inp.multiple=true;
    inp.onchange=()=>res([...inp.files]);
    inp.click();
  });
}
async function storePhotos(files,maxDim,q){
  const ids=[];
  for(const f of files){
    try{const data=await shrink(f,maxDim,q);const id=uid();
      if(await S.set('kt:ph:'+id,data))ids.push(id)}
    catch(e){toast(e.message)}
  }
  return ids;
}
const phCache={};
async function photo(id){
  if(phCache[id]!==undefined)return phCache[id];
  const v=await S.get('kt:ph:'+id,null);phCache[id]=v;return v;
}
async function paint(scope){
  const els=(scope||document).querySelectorAll('img[data-ph]');
  for(const el of els){const src=await photo(el.dataset.ph);if(src)el.src=src;el.removeAttribute('data-ph')}
}
function allPhotoIds(t){
  const ids=[];if(t.cover)ids.push(t.cover);
  (t.days||[]).forEach(d=>(d.photos||[]).forEach(p=>ids.push(p)));
  return ids;
}

/* ========== 모달 ========== */
function openModal(html,wire){
  $('#modal').innerHTML=html;$('#scrim').classList.add('on');if(wire)wire();
  const f=$('#modal').querySelector('input,textarea,select,button');if(f)f.focus();
}
function closeModal(){$('#scrim').classList.remove('on');$('#modal').innerHTML=''}
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeModal()});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if($('#lightbox').classList.contains('on'))return $('#lightbox').classList.remove('on');
  if($('#scrim').classList.contains('on'))return closeModal();
  if($('#detail').classList.contains('on'))closeDetail();
});
function confirmBox(msg,yes){
  openModal(`<h3>확인</h3><p style="margin:0;color:var(--dim);font-size:14px">${esc(msg)}</p>
  <div class="modal-acts"><button class="btn btn-sm" id="cNo">취소</button>
  <button class="btn btn-sm btn-gold" id="cYes">지우기</button></div>`,()=>{
    $('#cNo').onclick=closeModal;$('#cYes').onclick=()=>{closeModal();yes()}});
}
function lightbox(id,cap){
  photo(id).then(src=>{if(!src)return;
    $('#lbImg').src=src;$('#lbCap').textContent=cap||'';$('#lightbox').classList.add('on')});
}
$('#lightbox').onclick=()=>$('#lightbox').classList.remove('on');

/* ========== 히어로 ========== */
function renderHero(){
  $('#famName').textContent=hero.name;
  $('#famGreet').textContent=hero.greet;
  document.title=hero.name+' 여행 기록';
  const totalDays=trips.reduce((s,t)=>{
    if(!t.from)return s;
    const n=Math.round((new Date((t.to||t.from)+'T00:00:00')-new Date(t.from+'T00:00:00'))/86400000);
    return s+(isNaN(n)?0:n+1)},0);
  const places=new Set(trips.map(t=>t.region).filter(Boolean)).size;
  const shots=trips.reduce((s,t)=>s+allPhotoIds(t).length,0);
  $('#stats').innerHTML=[
    [trips.length,'여행'],[places,'다녀온 지역'],[totalDays,'함께한 날'],[shots,'남긴 사진']
  ].map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
}
$('#editHero').onclick=()=>openModal(`<h3>인사말 수정</h3>
  <div class="fld"><label>가족 이름</label><input id="hN" value="${esc(hero.name)}"></div>
  <div class="fld"><label>인사말</label><textarea id="hG">${esc(hero.greet)}</textarea></div>
  <div class="modal-acts"><button class="btn btn-sm" id="hC">취소</button>
  <button class="btn btn-sm btn-gold" id="hS">저장</button></div>`,()=>{
    $('#hC').onclick=closeModal;
    $('#hS').onclick=async()=>{hero={name:$('#hN').value.trim()||'강쓰리 가족',greet:$('#hG').value.trim()};
      renderHero();closeModal();await S.set(K.hero,hero)}});

/* ========== 여행 목록 ========== */
function renderFilters(){
  const years=[...new Set(trips.map(t=>(t.from||'').slice(0,4)).filter(Boolean))].sort().reverse();
  if(!years.length){$('#filters').innerHTML='';return}
  $('#filters').innerHTML=`<button class="fchip ${filterYear==='all'?'on':''}" data-act="fy" data-y="all">전체</button>`+
    years.map(y=>`<button class="fchip ${filterYear===y?'on':''}" data-act="fy" data-y="${y}">${y}</button>`).join('');
}
async function renderTrips(){
  renderFilters();
  const box=$('#tripsBox');
  const list=trips.filter(t=>filterYear==='all'||(t.from||'').slice(0,4)===filterYear);
  if(!list.length){
    box.innerHTML=`<div class="empty"><strong>${trips.length?'이 해에는 기록이 없습니다':'아직 남긴 여행이 없습니다'}</strong>
      ‘여행 추가’로 다녀온 길을 기록해보세요.</div>`;return;
  }
  const byYear={};
  list.forEach(t=>{const y=(t.from||'').slice(0,4)||'날짜 미정';(byYear[y]=byYear[y]||[]).push(t)});
  const years=Object.keys(byYear).sort().reverse();
  box.innerHTML=years.map(y=>{
    const items=byYear[y].sort((a,b)=>(b.from||'').localeCompare(a.from||''));
    return `<div class="yr">
      <div class="yr-label">${y}<small>${items.length}번의 여행</small></div>
      ${items.map(t=>{
        const shots=allPhotoIds(t).length;
        return `<article class="tcard" data-act="open" data-id="${t.id}" tabindex="0">
          ${t.cover?`<div class="cov"><img data-ph="${t.cover}" alt=""></div>`:`<div class="cov none">NO IMAGE</div>`}
          <div class="bd">
            <div class="loc">${esc(t.region||'어딘가')}</div>
            <h3>${esc(t.title)}</h3>
            <div class="per">${periodText(t)}</div>
            ${t.summary?`<div class="sum">${esc(t.summary)}</div>`:''}
            <div class="foot">
              ${t.rating?`<span class="stars">${stars(t.rating)}</span>`:''}
              ${(t.days||[]).length?`<span class="pill">${t.days.length}일 기록</span>`:''}
              ${shots?`<span class="pill ph">사진 ${shots}</span>`:''}
              ${(t.tags||[]).slice(0,3).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}
            </div>
          </div>
        </article>`}).join('')}
    </div>`}).join('');
  paint(box);
}

/* ========== 여행 입력 ========== */
function tripForm(t){
  const isNew=!t;
  t=t||{id:uid(),title:'',region:'',from:today(),to:'',summary:'',rating:0,tags:[],
        companions:'',stay:'',food:'',cover:null,days:[]};
  let cover=t.cover;
  openModal(`<h3>${isNew?'여행 추가':'여행 정보 수정'}</h3>
    <div class="fld"><label>여행 제목</label><input id="tT" value="${esc(t.title)}" placeholder="예: 첫 제주 가족여행"></div>
    <div class="fld"><label>지역</label><input id="tR" value="${esc(t.region)}" placeholder="예: 제주 서귀포"></div>
    <div class="fld row">
      <div><label>출발일</label><input type="date" id="tF" value="${esc(t.from)}"></div>
      <div><label>도착일</label><input type="date" id="tO" value="${esc(t.to)}"></div>
    </div>
    <div class="fld"><label>한 줄 요약</label><input id="tS" value="${esc(t.summary)}" placeholder="예: 비가 많이 왔지만 그래서 더 오래 기억나는"></div>
    <div class="fld row">
      <div><label>함께한 사람</label><input id="tC" value="${esc(t.companions)}" placeholder="예: 온 가족"></div>
      <div><label>만족도</label><select id="tRt">${[0,1,2,3,4,5].map(n=>
        `<option value="${n}" ${+t.rating===n?'selected':''}>${n?stars(n):'선택 안 함'}</option>`).join('')}</select></div>
    </div>
    <div class="fld row">
      <div><label>숙소</label><input id="tSt" value="${esc(t.stay)}"></div>
      <div><label>기억에 남은 음식</label><input id="tFd" value="${esc(t.food)}"></div>
    </div>
    <div class="fld"><label>태그</label><input id="tTg" value="${esc((t.tags||[]).join(', '))}" placeholder="쉼표로 구분 · 예: 바다, 캠핑">
      <div class="hint">카드 아래에 작은 표식으로 붙습니다.</div></div>
    <div class="fld"><label>대표 사진</label>
      <button class="btn btn-sm" id="tPick">${cover?'사진 바꾸기':'사진 고르기'}</button>
      <span class="hint" id="tPm" style="margin-left:10px">${cover?'등록됨':''}</span></div>
    <div class="modal-acts">
      <button class="btn btn-sm" id="tC2">취소</button>
      <button class="btn btn-sm btn-gold" id="tSv">저장</button></div>`,()=>{
    $('#tC2').onclick=closeModal;
    $('#tPick').onclick=async()=>{
      const files=await pickPhotos(false);if(!files.length)return;
      const ids=await storePhotos(files,1600,.76);
      if(ids.length){cover=ids[0];$('#tPm').textContent='등록됨'}};
    $('#tSv').onclick=async()=>{
      const title=$('#tT').value.trim();
      if(!title){toast('여행 제목을 입력해 주세요.');return}
      Object.assign(t,{title,region:$('#tR').value.trim(),from:$('#tF').value,to:$('#tO').value,
        summary:$('#tS').value.trim(),companions:$('#tC').value.trim(),rating:+$('#tRt').value,
        stay:$('#tSt').value.trim(),food:$('#tFd').value.trim(),cover,
        tags:$('#tTg').value.split(',').map(s=>s.trim()).filter(Boolean)});
      if(isNew)trips.push(t);
      closeModal();await S.set(K.trips,trips);
      renderHero();renderTrips();renderAlbum();
      if(openTripId===t.id)renderDetail();
      if(isNew){openTripId=t.id;openDetail(t.id);toast('이제 하루씩 기록을 더해보세요.')}};
  });
}
$('#addTrip').onclick=()=>tripForm(null);

/* ========== 여행 상세 ========== */
function openDetail(id){openTripId=id;$('#detail').classList.add('on');
  document.body.style.overflow='hidden';renderDetail();$('#detail').scrollTop=0}
function closeDetail(){openTripId=null;$('#detail').classList.remove('on');document.body.style.overflow=''}

async function renderDetail(){
  const t=trips.find(x=>x.id===openTripId);if(!t)return closeDetail();
  const dayList=[...(t.days||[])].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  $('#detailIn').innerHTML=`
    <div class="dt-bar">
      <button class="btn btn-sm" data-act="closeDetail">← 목록으로</button>
      <div style="display:flex;gap:6px">
        <button class="btn btn-sm" data-act="editTrip" data-id="${t.id}">정보 수정</button>
        <button class="btn btn-sm btn-q" data-act="delTrip" data-id="${t.id}">여행 삭제</button>
      </div>
    </div>
    <div class="dt-hero">
      ${t.cover?`<img class="dt-cover" data-ph="${t.cover}" alt="">`:''}
      <div class="loc">${esc(t.region||'어딘가')}</div>
      <h2>${esc(t.title)}</h2>
      <div class="per">${periodText(t)}</div>
      ${t.summary?`<p class="sum">${esc(t.summary)}</p>`:''}
      ${(t.tags||[]).length?`<div class="tags">${t.tags.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>`:''}
      <dl class="meta">
        <div><dt>함께한 사람</dt><dd>${esc(t.companions||'—')}</dd></div>
        <div><dt>숙소</dt><dd>${esc(t.stay||'—')}</dd></div>
        <div><dt>기억에 남은 음식</dt><dd>${esc(t.food||'—')}</dd></div>
        <div><dt>만족도</dt><dd class="stars">${t.rating?stars(t.rating):'—'}</dd></div>
      </dl>
    </div>
    <div class="sec-head" style="margin-top:36px">
      <div><h2 style="font-size:24px">하루하루</h2><p>날짜별로 들른 곳과 사진을 남깁니다.</p></div>
      <button class="btn btn-gold btn-sm" data-act="addDayLog">하루 추가</button>
    </div>
    ${dayList.length?dayList.map((d,i)=>`
      <div class="dayblk">
        <div class="dh">
          <span class="dnum">DAY ${i+1}</span>
          <h4>${esc(d.title||'제목 없는 하루')}</h4>
          <span class="dd">${fmt(d.date)}</span>
        </div>
        ${(d.places||[]).length?`<ul class="places">${d.places.map(p=>
          `<li>${esc(p.name)}${p.memo?` <em>— ${esc(p.memo)}</em>`:''}</li>`).join('')}</ul>`:''}
        ${d.memo?`<div class="dmemo">${esc(d.memo)}</div>`:''}
        ${(d.photos||[]).length?`<div class="shots">${d.photos.map(p=>
          `<img data-ph="${p}" data-act="lb" data-pid="${p}" data-cap="${esc(d.title||'')} ${fmt(d.date)}" alt="">`).join('')}</div>`:''}
        <div class="dayacts">
          <button class="btn btn-sm btn-q" data-act="addShots" data-did="${d.id}">사진 추가</button>
          <button class="btn btn-sm btn-q" data-act="editDayLog" data-did="${d.id}">수정</button>
          <button class="btn btn-sm btn-q" data-act="delDayLog" data-did="${d.id}">삭제</button>
        </div>
      </div>`).join(''):
      `<div class="empty"><strong>아직 하루 기록이 없습니다</strong>‘하루 추가’로 첫날부터 남겨보세요.</div>`}`;
  paint($('#detailIn'));
}

function dayLogForm(t,d){
  const isNew=!d;
  d=d||{id:uid(),date:t.from||today(),title:'',places:[],memo:'',photos:[]};
  const placeText=(d.places||[]).map(p=>p.name+(p.memo?' | '+p.memo:'')).join('\n');
  openModal(`<h3>${isNew?'하루 추가':'하루 수정'}</h3>
    <div class="fld row">
      <div><label>날짜</label><input type="date" id="lD" value="${esc(d.date)}"></div>
      <div><label>그날의 제목</label><input id="lT" value="${esc(d.title)}" placeholder="예: 바람 많던 첫날"></div>
    </div>
    <div class="fld"><label>들른 곳</label>
      <textarea id="lP" placeholder="한 줄에 한 곳씩&#10;성산일출봉 | 해뜨기 전에 올라감">${esc(placeText)}</textarea>
      <div class="hint">장소 뒤에 세로선( | )을 넣으면 짧은 메모가 함께 붙습니다.</div></div>
    <div class="fld"><label>그날의 기록</label><textarea id="lM">${esc(d.memo)}</textarea></div>
    <div class="modal-acts">
      <button class="btn btn-sm" id="lC">취소</button>
      <button class="btn btn-sm btn-gold" id="lS">저장</button></div>`,()=>{
    $('#lC').onclick=closeModal;
    $('#lS').onclick=async()=>{
      d.date=$('#lD').value;d.title=$('#lT').value.trim();d.memo=$('#lM').value.trim();
      d.places=$('#lP').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
        const [name,...rest]=l.split('|');return {name:name.trim(),memo:rest.join('|').trim()}});
      t.days=t.days||[];if(isNew)t.days.push(d);
      closeModal();await S.set(K.trips,trips);renderDetail();renderTrips();renderAlbum();renderHero()};
  });
}

/* ========== 사진첩 ========== */
async function renderAlbum(){
  const box=$('#albumBox');
  const items=[];
  trips.forEach(t=>{
    (t.days||[]).forEach(d=>(d.photos||[]).forEach(p=>
      items.push({id:p,cap:`${t.title} · ${d.title||fmt(d.date)}`,date:d.date||t.from||''})));
    if(t.cover)items.push({id:t.cover,cap:t.title,date:t.from||''});
  });
  if(!items.length){
    box.innerHTML=`<div class="empty"><strong>모인 사진이 없습니다</strong>
      여행 기록에 사진을 넣으면 여기에 함께 모입니다.</div>`;return;
  }
  items.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  box.innerHTML=`<div class="album">${items.map(i=>`
    <figure class="plate" data-act="lb" data-pid="${i.id}" data-cap="${esc(i.cap)}">
      <img data-ph="${i.id}" alt="${esc(i.cap)}">
      <figcaption>${esc(i.cap)}</figcaption>
    </figure>`).join('')}</div>`;
  paint(box);
}

/* ========== 기념일 ========== */
function renderDays(){
  const box=$('#daysBox');
  if(!days.length){box.innerHTML=`<div class="empty"><strong>등록된 날짜가 없습니다</strong>
    생일, 기념일, 다음 여행 출발일을 더해보세요.</div>`;return}
  box.innerHTML=[...days].sort((a,b)=>ddayInfo(a.date,a.yearly).sort-ddayInfo(b.date,b.yearly).sort)
    .map(d=>{const i=ddayInfo(d.date,d.yearly);
      return `<div class="day-row">
        <div class="dday ${i.past?'past':''}">${i.label}<small>${d.yearly?'해마다':'한 번'}</small></div>
        <div class="day-body"><div class="t">${esc(d.title)}</div><div class="d">${fmt(d.date)}</div></div>
        <div class="row-acts">
          <button class="btn btn-sm btn-q" data-act="editDay" data-id="${d.id}">수정</button>
          <button class="btn btn-sm btn-q" data-act="delDay" data-id="${d.id}">삭제</button></div>
      </div>`}).join('');
}
function dayForm(d){
  const isNew=!d;
  d=d||{id:uid(),title:'',date:today(),yearly:true};
  openModal(`<h3>${isNew?'날짜 추가':'날짜 수정'}</h3>
    <div class="fld"><label>이름</label><input id="dT" value="${esc(d.title)}" placeholder="예: 다음 여행 출발"></div>
    <div class="fld"><label>날짜</label><input type="date" id="dD" value="${esc(d.date)}"></div>
    <div class="fld"><label>반복</label><select id="dY">
      <option value="1" ${d.yearly?'selected':''}>해마다 돌아옵니다</option>
      <option value="0" ${!d.yearly?'selected':''}>한 번뿐인 일정입니다</option></select></div>
    <div class="modal-acts"><button class="btn btn-sm" id="dC">취소</button>
    <button class="btn btn-sm btn-gold" id="dS">저장</button></div>`,()=>{
    $('#dC').onclick=closeModal;
    $('#dS').onclick=async()=>{
      const title=$('#dT').value.trim();if(!title){toast('이름을 입력해 주세요.');return}
      d.title=title;d.date=$('#dD').value;d.yearly=$('#dY').value==='1';
      if(isNew)days.push(d);closeModal();renderDays();await S.set(K.days,days)}});
}
$('#addDay').onclick=()=>dayForm(null);

/* ========== 시간표 ========== */
function renderTT(){
  $('#memberBox').innerHTML=tt.members.map(m=>
    `<span class="chip"><i style="background:${m.color}"></i>${esc(m.name)}
     <button data-act="delMember" data-id="${m.id}">×</button></span>`).join('')
    ||`<span style="color:var(--dim);font-size:13px">가족을 추가하면 칸마다 담당을 표시할 수 있습니다.</span>`;
  const head=`<thead><tr><th></th>${DAYS.map((d,i)=>`<th class="${i===6?'sun':''}">${d}</th>`).join('')}</tr></thead>`;
  const body=tt.slots.map((slot,si)=>`<tr><th>${esc(slot)}</th>${DAYS.map((_,di)=>{
    const c=tt.cells[si+'-'+di];const m=c&&c.who?tt.members.find(x=>x.id===c.who):null;
    return `<td><button class="cell ${c&&c.text?'':'blank'}" data-act="cell" data-si="${si}" data-di="${di}">
      ${c&&c.text?esc(c.text):'+'}
      ${m?`<span class="who"><i style="background:${m.color}"></i>${esc(m.name)}</span>`:''}</button></td>`
  }).join('')}</tr>`).join('');
  $('#ttTable').innerHTML=head+'<tbody>'+body+'</tbody>';
}
function cellForm(si,di){
  const key=si+'-'+di;const c=tt.cells[key]||{text:'',who:''};
  openModal(`<h3>${esc(tt.slots[si])} · ${DAYS[di]}요일</h3>
    <div class="fld"><label>할 일</label><input id="cT" value="${esc(c.text)}"></div>
    <div class="fld"><label>담당</label><select id="cW"><option value="">지정 안 함</option>
      ${tt.members.map(m=>`<option value="${m.id}" ${c.who===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}
    </select></div>
    <div class="modal-acts"><button class="btn btn-sm btn-q" id="cX">비우기</button>
    <button class="btn btn-sm" id="cC">취소</button>
    <button class="btn btn-sm btn-gold" id="cS">저장</button></div>`,()=>{
    $('#cC').onclick=closeModal;
    $('#cX').onclick=async()=>{delete tt.cells[key];closeModal();renderTT();await S.set(K.tt,tt)};
    $('#cS').onclick=async()=>{const text=$('#cT').value.trim();
      if(text)tt.cells[key]={text,who:$('#cW').value};else delete tt.cells[key];
      closeModal();renderTT();await S.set(K.tt,tt)}});
}
$('#addMember').onclick=()=>openModal(`<h3>가족 추가</h3>
  <div class="fld"><label>이름</label><input id="mN" placeholder="예: 아빠"></div>
  <div class="modal-acts"><button class="btn btn-sm" id="mC">취소</button>
  <button class="btn btn-sm btn-gold" id="mS">추가</button></div>`,()=>{
    $('#mC').onclick=closeModal;
    $('#mS').onclick=async()=>{const n=$('#mN').value.trim();
      if(!n){toast('이름을 입력해 주세요.');return}
      tt.members.push({id:uid(),name:n,color:PALETTE[tt.members.length%PALETTE.length]});
      closeModal();renderTT();await S.set(K.tt,tt)}});

/* ========== 이벤트 위임 ========== */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  const t=()=>trips.find(x=>x.id===openTripId);

  if(a==='fy'){filterYear=b.dataset.y;renderTrips();return}
  if(a==='open'){openDetail(id);return}
  if(a==='closeDetail'){closeDetail();return}
  if(a==='lb'){lightbox(b.dataset.pid,b.dataset.cap);return}
  if(a==='editTrip'){tripForm(trips.find(x=>x.id===id));return}
  if(a==='delTrip')return confirmBox('이 여행 기록과 사진을 모두 지울까요?',async()=>{
    const tr=trips.find(x=>x.id===id);if(tr)for(const p of allPhotoIds(tr))await S.del('kt:ph:'+p);
    trips=trips.filter(x=>x.id!==id);closeDetail();
    await S.set(K.trips,trips);renderTrips();renderAlbum();renderHero()});
  if(a==='addDayLog'){dayLogForm(t(),null);return}
  if(a==='editDayLog'){dayLogForm(t(),t().days.find(d=>d.id===b.dataset.did));return}
  if(a==='delDayLog')return confirmBox('이 하루 기록을 지울까요?',async()=>{
    const tr=t();const d=tr.days.find(x=>x.id===b.dataset.did);
    if(d)for(const p of(d.photos||[]))await S.del('kt:ph:'+p);
    tr.days=tr.days.filter(x=>x.id!==b.dataset.did);
    await S.set(K.trips,trips);renderDetail();renderTrips();renderAlbum();renderHero()});
  if(a==='addShots'){
    const tr=t();const d=tr.days.find(x=>x.id===b.dataset.did);if(!d)return;
    const files=await pickPhotos(true);if(!files.length)return;
    toast('사진을 정리하는 중입니다…');
    const ids=await storePhotos(files,1500,.75);
    d.photos=(d.photos||[]).concat(ids);
    await S.set(K.trips,trips);renderDetail();renderAlbum();renderHero();
    if(ids.length)toast(`사진 ${ids.length}장을 담았습니다.`);return}
  if(a==='editDay'){dayForm(days.find(d=>d.id===id));return}
  if(a==='delDay')return confirmBox('이 날짜를 지울까요?',async()=>{
    days=days.filter(d=>d.id!==id);renderDays();await S.set(K.days,days)});
  if(a==='delMember')return confirmBox('이 가족을 목록에서 지울까요?',async()=>{
    tt.members=tt.members.filter(m=>m.id!==id);
    Object.values(tt.cells).forEach(c=>{if(c.who===id)c.who=''});
    renderTT();await S.set(K.tt,tt)});
  if(a==='cell'){cellForm(+b.dataset.si,+b.dataset.di);return}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const c=e.target.closest('.tcard');if(c){e.preventDefault();openDetail(c.dataset.id)}
});
$('#resetAll').onclick=()=>confirmBox('여행 기록, 사진, 기념일, 시간표를 모두 지웁니다. 되돌릴 수 없습니다.',async()=>{
  for(const tr of trips)for(const p of allPhotoIds(tr))await S.del('kt:ph:'+p);
  trips=[];days=[];tt={members:[],slots:['아침','오전','오후','저녁','밤'],cells:{}};
  await Promise.all([S.set(K.trips,trips),S.set(K.days,days),S.set(K.tt,tt)]);
  renderTrips();renderAlbum();renderDays();renderTT();renderHero();toast('모두 지웠습니다.')});

  if(on){

/* ========== 별 배경 ========== */
(function sky(){
  const c=document.getElementById('sky'),ctx=c.getContext('2d');
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let stars=[],shoot=null,W,H;
  function build(){
    W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;
    c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';
    const n=Math.round(innerWidth*innerHeight/5400);
    stars=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,
      r:(Math.random()*1.2+.25)*devicePixelRatio,a:Math.random()*.6+.25,
      tw:Math.random()*.014+.004,p:Math.random()*6.28,
      v:(Math.random()*.055+.014)*devicePixelRatio}));
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(const s of stars){
      if(!still){s.p+=s.tw;s.y-=s.v;if(s.y<-2){s.y=H+2;s.x=Math.random()*W}}
      ctx.globalAlpha=still?s.a:s.a*(.6+.4*Math.sin(s.p));
      ctx.fillStyle=s.r>1.4*devicePixelRatio?'#ffeccd':'#fff';
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();
    }
    ctx.globalAlpha=1;
    if(!still){
      if(!shoot&&Math.random()<.002)shoot={x:Math.random()*W*.8,y:Math.random()*H*.42,len:0,life:0};
      if(shoot){
        shoot.life++;shoot.x+=7*devicePixelRatio;shoot.y+=2.6*devicePixelRatio;
        shoot.len=Math.min(150*devicePixelRatio,shoot.len+9*devicePixelRatio);
        const g=ctx.createLinearGradient(shoot.x,shoot.y,shoot.x-shoot.len,shoot.y-shoot.len*.37);
        g.addColorStop(0,'rgba(255,240,214,.9)');g.addColorStop(1,'rgba(255,240,214,0)');
        ctx.strokeStyle=g;ctx.lineWidth=1.4*devicePixelRatio;
        ctx.beginPath();ctx.moveTo(shoot.x,shoot.y);
        ctx.lineTo(shoot.x-shoot.len,shoot.y-shoot.len*.37);ctx.stroke();
        if(shoot.life>68)shoot=null;
      }
      requestAnimationFrame(draw);
    }
  }
  build();requestAnimationFrame(draw);
  addEventListener('resize',()=>{build();if(still)draw()});
})();

/* ========== 시작 ========== */
async function boot(){
  hero=await S.get(K.hero,hero);
  trips=await S.get(K.trips,[]);
  days=await S.get(K.days,[]);
  tt=await S.get(K.tt,{members:[],slots:['아침','오전','오후','저녁','밤'],cells:{}});
  renderHero();renderTrips();renderAlbum();renderDays();renderTT();
  if(await S.get(K.bg,false))setBg(true);
}

/* ========== 가족 비밀번호 잠금 ========== */
const FAMILY_PW='1402';
const GATE_KEY='kt-gate-ok';
function unlock(){
  document.documentElement.classList.add('unlocked');
  $('#gate').classList.add('hide');
  boot();
}
if(sessionStorage.getItem(GATE_KEY)==='1'){
  unlock();
}else{
  $('#gateForm').addEventListener('submit',e=>{
    e.preventDefault();
    const v=$('#gatePw').value.trim();
    if(v===FAMILY_PW){
      sessionStorage.setItem(GATE_KEY,'1');
      unlock();
    }else{
      $('#gateErr').textContent='비밀번호가 올바르지 않습니다.';
      $('#gatePw').value='';$('#gatePw').focus();
    }
  });
}
